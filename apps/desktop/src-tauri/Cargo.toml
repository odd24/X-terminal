[package]
name = "shared-terminal-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
load-observer-test = ["dep:sha2"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
config-model = { path = "../../../crates/config-model" }
tauri = { version = "=2.12.5", features = [] }
session-core = { path = "../../../crates/session-core" }
session-protocol = { path = "../../../crates/session-protocol" }
session-service = { path = "../../../crates/session-service" }
terminal-log = { path = "../../../crates/terminal-log" }
windows = { version = "=0.62.2", features = ["Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_UI_WindowsAndMessaging"] }
tokio = { version = "=1.54.1", features = ["process", "sync", "time", "io-util"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = { version = "=0.11.1", optional = true }
uuid = { version = "=1.29.0", features = ["v4", "serde"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }
