[package]
name = "session-service"
version.workspace = true
edition.workspace = true
default-run = "session-service"
rust-version.workspace = true
license.workspace = true

[features]
serial-ui-fixture = ["transport-serial/test-backend"]
serial-mcp-fixture = ["serial-ui-fixture"]
audit-diagnostics-fixture = ["terminal-log/audit-diagnostics-fixture"]
log-disk-full-fixture = ["terminal-log/log-disk-full-fixture"]
t19-timeline-fixture = ["terminal-log/log-timeline-fixture"]
ssh1-with-helper = []

[[bin]]
name = "session-service-t19-timeline"
path = "src/bin/t19_timeline.rs"
required-features = ["t19-timeline-fixture"]

[[test]]
name = "ssh1_resize_child"
harness = false

[dependencies]
encoding_rs = "=0.8.44"
config-store = { path = "../config-store" }
transport-ssh2 = { path = "../transport-ssh2" }
transport-ssh1 = { path = "../transport-ssh1" }
transport-serial = { path = "../transport-serial" }
serialport = { version = "=4.10.1", default-features = false }
credential-vault = { path = "../credential-vault" }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
zeroize = "=1.9.1"
session-core = { path = "../session-core" }
terminal-log = { path = "../terminal-log" }
session-protocol = { path = "../session-protocol" }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "io-util", "io-std", "signal", "process"] }
sha2 = "=0.11.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.29.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
transport-serial = { path = "../transport-serial", features = ["test-backend"] }
russh = { version = "=0.65.0", default-features = false, features = ["ring", "rsa", "flate2"] }
rand = "=0.10.3"
