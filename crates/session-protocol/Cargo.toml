[package]
name = "session-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
config-model = { path = "../config-model" }
session-core = { path = "../session-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
schemars = { version = "=1.2.3", features = ["uuid1"] }
uuid = { version = "=1.29.0", features = ["serde"] }
tokio = { version = "=1.54.1", features = ["io-util"] }
zeroize = "=1.9.1"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["macros", "rt"] }
