[package]
name = "terminal-log"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
audit-diagnostics-fixture = []
log-disk-full-fixture = []
save-recovery-fixture = []

[dependencies]
session-core = { path = "../session-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
uuid = { version = "=1.29.0", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Security_Authorization"] }
