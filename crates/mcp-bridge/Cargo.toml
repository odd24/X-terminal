[package]
name = "mcp-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "terminal-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "io-std", "signal", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
schemars = "=1.2.3"
anyhow = "=1.0.104"
session-protocol = { path = "../session-protocol" }
session-core = { path = "../session-core" }
uuid = { version = "=1.29.0", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
session-service = { path = "../session-service" }
