[package]
name = "session-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
encoding_rs = "=0.8.44"
vt100 = { version = "=0.18.1", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
schemars = { version = "=1.2.3", features = ["uuid1"] }
uuid = { version = "=1.29.0", features = ["v4", "serde"] }
rand = "=0.10.3"
sha2 = "=0.11.1"
zeroize = "=1.9.1"
regex = "=1.13.1"
regex-syntax = "=0.8.11"

[dev-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
