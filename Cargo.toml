[workspace]
members = ["apps/desktop/src-tauri", "crates/session-core", "crates/transport-ssh2", "crates/transport-serial", "crates/mcp-bridge", "crates/session-protocol", "crates/session-service", "crates/config-store", "crates/credential-vault", "crates/config-model"]
resolver = "2"
exclude = ["vendor/russh"]

[patch.crates-io]
russh = { path = "vendor/russh" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-Proprietary"

[profile.release]
strip = true
lto = "thin"
